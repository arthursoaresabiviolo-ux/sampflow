<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sampflow-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="45%" stop-color="#f8c301"/>
      <stop offset="100%" stop-color="#d49200"/>
    </linearGradient>
    <linearGradient id="sampflow-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142436"/>
      <stop offset="100%" stop-color="#0a131e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#f8c301" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- High contrast dark squircle container with SampFlow golden rim -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#sampflow-bg)" stroke="#f8c301" stroke-width="1.8" stroke-opacity="0.7"/>

  <!-- Coffee bean & Flow seam motif -->
  <g transform="rotate(-28 32 32)" filter="url(#glow)">
    <path d="M 30.5 11.5 C 19 12, 16 23, 16 32 C 16 41, 19 52, 30.5 52.5 C 28 44, 33 37, 30.5 32 C 28 27, 33 20, 30.5 11.5 Z" fill="url(#sampflow-gold)"/>
    <path d="M 33.5 11.5 C 45 12, 48 23, 48 32 C 48 41, 45 52, 33.5 52.5 C 31 44, 36 37, 33.5 32 C 31 27, 36 20, 33.5 11.5 Z" fill="url(#sampflow-gold)"/>
  </g>
</svg>
