<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SampFlow</title>
    <link rel="stylesheet" href="/static/home/css/home.css">

</head>
<body>
    <h1>Tela Inicial</h1>

    <p>Bem-vindo ao SampFlow!</p>

    <p>Confira abaixo a situação de suas amostras:</p>

    <div>
        <button onclick="document.getElementById('modal-client').showModal()">Adicionar Cliente</button>

        <dialog id="modal-client">
            <h3>Cadastrar Cliente</h3>
            <form method="POST" action="{% url 'create_client' %}"> {% csrf_token %}
                <div>
                    <label for="name">Nome:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div>
                    <label for="country">País:</label>
                    <input type="text" id="country" name="country" required>
                </div>
                <br>
                <button type="submit">Salvar</button>
                <button type="button" onclick="document.getElementById('modal-client').close()">Cancelar</button>
            </form>
        </dialog>
    </div>
    
</body>
<footer>
    <p>&copy; 2026 SampFlow. Todos os direitos reservados.</p>
</footer>
</html>
