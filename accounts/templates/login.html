<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SampFlow</title>
    <link rel="stylesheet" href="static/accounts/css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> <!-- font-awesome -->
</head>
<body>
    <h1>Tela de login</h1>

    <p>Informe seu email e senha para acessar sua conta.</p>

    <form action="{% url 'login' %}" method="POST"> {% csrf_token %}
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Digite seu email" required><br><br>

        <label for="password">Senha:</label>
        <input type="password" id="password" name="password" placeholder="Digite sua senha" required><br><br>

        <button type="submit">Entrar</button>
    </form>
    <p>Esqueceu sua senha? <a href="{% url 'forgot_password' %}">Clique aqui</a> para recuperá-la.</p>
    <script src="static/accounts/js/login.js"></script>
</body>
<footer>
    <p>&copy; 2026 SampFlow. Todos os direitos reservados.</p>
</footer>
</html>
