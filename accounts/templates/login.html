<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SampFlow - Login</title>
    <link rel="stylesheet" href="static/accounts/css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <main class="login-wrapper">
        <header class="login-header">
            <h1>Tela de login</h1>
            <p>Informe seu email e senha para acessar sua conta.</p>
        </header>

        <form action="{% url 'login' %}" method="POST" class="login-card"> {% csrf_token %}
            
            <div class="form-group">
                <label for="email">EMAIL:</label>
                <input type="email" id="email" name="email" placeholder="Digite seu email" required>
            </div>

            <div class="form-group">
                <label for="password">SENHA:</label>
                <div class="input-password-wrapper">
                    <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
                    <button type="button" id="togglePassword" aria-label="Mostrar/Ocultar senha">
                        <i class="fa-solid fa-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit">ENTRAR</button>
        </form>

        <p class="forgot-password-text">Esqueceu sua senha? <a href="{% url 'forgot_password' %}">Clique aqui</a> para recuperá-la.</p>
    </main>

    <footer>
        <p>&copy; 2026 SampFlow. Todos os direitos reservados.</p>
    </footer>

    <script src="static/accounts/js/login.js"></script>
</body>
</html>
