{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SampFlow - Recuperação de Senha</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">
    <link rel="alternate icon" type="image/png" sizes="32x32" href="{% static 'img/favicon-32x32.png' %}">
    <link rel="alternate icon" type="image/png" sizes="16x16" href="{% static 'img/favicon-16x16.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'img/apple-touch-icon.png' %}">
    <link rel="shortcut icon" href="{% static 'img/favicon.ico' %}">
    <link rel="stylesheet" href="{% static 'accounts/css/forgot_password.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
</head>
<body>
    <main class="login-wrapper recovery-wrapper">
        <header class="login-header recovery-header">
            <h1>Recuperar Senha</h1>
            <p>Informe seu email para receber instruções de recuperação de senha.</p>
        </header>

        <form action="{% url 'forgot_password' %}" method="POST" class="login-card recovery-card"> {% csrf_token %}
            
            <div class="form-group">
                <label for="email">EMAIL:</label>
                <input type="email" id="email" name="email" placeholder="Digite seu email" required>
            </div>

            <button type="submit" class="btn-submit">ENVIAR INSTRUÇÕES</button>
            <p class="forgot-password-text back-to-login-text">Lembrou sua senha? <a href="{% url 'login' %}">Voltar para o login</a>.</p>
        </form>

    </main>

    <footer>
        <p>&copy; 2026 SampFlow. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
