<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SampFlow</title>
    <link rel="stylesheet" href="/static/accounts/css/forgot_password.css">
</head>
<body>
    <h1>Tela de recuperação de senha</h1>

    <p>Informe seu email para receber instruções de recuperação de senha.</p>

    <form action="{% url 'forgot_password' %}" method="POST"> {% csrf_token %}
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Digite seu email" required><br><br>

        <button type="submit">Enviar instruções</button>
    </form>
</body>
<footer>

</footer>
</html>
